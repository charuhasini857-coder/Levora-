<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LEVORA – Your Life, Your Choice</title><style>
:root{color-scheme:dark;--bg:#121214;--card:#1b1b22;--tx:#e8eaf6;--mu:#b3b6cc;--ac:#12b886;--pu:#7c5cfc;--bl:#0b8f65;--ln:#32323f;--ok:#12b886;--wr:#d4b06a;--gd:#d4b06a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:radial-gradient(circle at 10% 0,#7c5cfc26,transparent 40%),radial-gradient(circle at 90% 35%,#12b88618,transparent 40%),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;color:var(--mu);text-decoration:none;font-size:14px}nav a.on,nav a:hover{background:linear-gradient(90deg,var(--pu),var(--bl));color:#fff}
main{max-width:860px;margin:0 auto;padding:18px 16px 60px}h1{font-size:2.4rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:.2em 0}h2{margin:.2em 0 .5em}
.hero{padding:36px 22px;border-radius:24px;border:1px solid #7c5cfc66;box-shadow:0 0 40px #7c5cfc22;background:radial-gradient(circle at 85% 10%,#7c5cfc44,transparent 45%),radial-gradient(circle at 10% 100%,#12b88633,transparent 45%),#161619;color:#e8eaf6;text-align:center}.hero h1{font-size:1.7rem}.wm{font-size:clamp(2.6rem,13vw,4.5rem);font-weight:700;letter-spacing:.12em;line-height:1}.wm b{color:#12b886}.tg{color:#d4b06a;letter-spacing:.22em;font-size:.78rem;border-top:2px solid #d4b06a;display:inline-block;padding-top:10px;margin:10px 0 18px}
.hero p{color:#d6dcff}.g{background:linear-gradient(90deg,#12b886,#7c5cfc,#d4b06a);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid .card{margin:0}.grid a.card{display:block;color:inherit;text-decoration:none;transition:transform .2s}.grid a.card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 6px 24px #12b88622}
button,.btn{background:linear-gradient(90deg,var(--pu),var(--bl));color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block;margin:4px 4px 4px 0}
button.o{background:transparent;border:1px solid var(--ln);color:var(--tx)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}input[type=checkbox]{width:auto;margin-right:8px}
.mu{color:var(--mu);font-size:14px}.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;border:1px solid var(--ln)}.sim{border:1px dashed var(--wr);color:var(--wr);padding:6px 10px;border-radius:10px;font-size:13px;margin:8px 0}
.bar{height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--pu));transition:width .5s}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-weight:700;margin:auto}.ring span{background:var(--card);width:74px;height:74px;border-radius:50%;display:grid;place-items:center}
.cols{display:flex;align-items:flex-end;gap:8px;height:110px}.cols div{flex:1;background:linear-gradient(var(--ac),var(--pu));border-radius:6px 6px 0 0;min-height:4px}
.chat{max-height:300px;overflow:auto}.me{text-align:right;color:var(--ac)}.ok{color:var(--ok)}.bad{color:var(--wr)}
#breath{width:90px;height:90px;border-radius:50%;background:radial-gradient(var(--ac),var(--pu));margin:14px auto;animation:b 8s ease-in-out infinite}@keyframes b{0%,100%{transform:scale(.6)}50%{transform:scale(1.15)}}
@media(prefers-reduced-motion:reduce){#breath{animation:none}.grid a.card{transition:none}}
</style></head><body><nav id="nav" aria-label="Main"></nav><main id="app" tabindex="-1"></main><script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={};try{S=JSON.parse(localStorage.getItem("rs"))||{}}catch(e){}
S=Object.assign({week:[3,4,2,5,4,0,0],chk:[],cd:"",quiz:null,asm:null,sim:{},rep:[],goals:[],mins:0,scr:null,adm:0},S);
const sv=()=>{try{localStorage.setItem("rs",JSON.stringify(S))}catch(e){}};
const TI=(new Date().getDay()+6)%7,DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],today=new Date().toDateString();
if(S.cd!==today){S.cd=today;S.chk=[];sv()}
const P=[["home","Home"],["about","About"],["dash","Dashboard"],["companion","Companion"],["assess","Self-check"],["quiz","Myth vs Fact"],["sim","Peer Pressure"],["habits","Habits"],["detox","Digital Detox"],["future","Future Self"],["help","Help"],["report","Report"],["admin","Admin"]];
const ring=(p,l)=>`<div class="ring" style="background:conic-gradient(var(--ac) ${p*3.6}deg,var(--ln) 0)"><span>${l}</span></div>`;
const bar=p=>`<div class="bar"><i style="width:${p}%"></i></div>`;
const sim=t=>`<div class="sim">Simulated: ${t}</div>`;
const nb=()=>S.chk.length;
function streak(){let n=0;for(let i=TI;i>=0&&S.week[i]>=3;i--)n++;return n}
const R={
home:()=>`<div class="hero"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="LEVORA logo"><path d="M40 14A48 48 0 1 0 80 14" fill="none" stroke="#e8eaf6" stroke-width="5" stroke-linecap="round"/><path d="M22 36Q22 68 54 76Q58 50 22 36Z" fill="#12b886"/><path d="M98 36Q98 68 66 76Q62 50 98 36Z" fill="#0e9a70"/><path d="M38 96Q48 76 60 82Q72 76 82 96Q60 104 38 96Z" fill="#7c5cfc"/><path d="M60 62L50 46M60 62L70 46" stroke="#e8eaf6" stroke-width="5" stroke-linecap="round"/><rect x="57" y="58" width="6" height="34" rx="3" fill="#e8eaf6"/><circle cx="60" cy="48" r="7" fill="#d4b06a"/></svg><div class="wm" aria-label="LEVORA">LEV<b>O</b>RA</div><div class="tg">CHOOSE LIFE. RISE BEYOND ADDICTION.</div><h1>Your Life, Your Choice.</h1><p>Your life. Your rules. Level up your habits, learn to say no like a boss, and find real people who’ve got your back. No judgment. No sign-up.</p><a class="btn" href="#assess">Try the private self-check</a><a class="btn o" href="#sim">Practise saying no</a></div>
<p class="mu" style="text-align:center">Awareness → Self-discovery → Action → Healthy habits → Support → A better future</p>
<div class="grid">${P.slice(3,11).map(p=>`<a class="card" href="#${p[0]}"><b>${p[1]}</b><div class="mu">${{companion:"Ask anything, judgment-free",assess:"Anonymous, no labels",quiz:"Test what you know",sim:"Choose your path in real situations",habits:"7-day RE:START challenge",detox:"Focus timer and balance score",future:"Link today to your goals",help:"Real helplines and trusted adults"}[p[0]]}</div></a>`).join("")}</div>
${sim("This is a hackathon prototype. Data stays in your own browser; nothing is sent to a server.")}`,
about:()=>`<h1>About LEVORA</h1><div class="card"><p>LEVORA helps teenagers and young adults understand addiction, resist peer pressure, build healthier habits and reach human support, without fear of judgment.</p><p><b>What it is not:</b> a diagnosis tool or a replacement for a counselor. It never labels anyone.</p></div><div class="card"><h2>Privacy by design</h2><p>No account, no tracking. Progress is saved only on this device and you can erase it any time.</p><button class="o" onclick="if(confirm('Delete all saved data on this device?')){localStorage.removeItem('rs');location.reload()}">Delete my data</button></div>${sim("The backend, database, login and real AI are not connected in this prototype. Features are labeled where they are demonstrations.")}`,
dash:()=>{const t=S.week[TI]=nb(),tot=S.week.reduce((a,b)=>a+b,0);return`<h1>Your dashboard</h1><div class="grid"><div class="card">${ring(Math.round(t/5*100),t+"/5")}<p class="mu" style="text-align:center">Today’s goals</p></div><div class="card"><h2>${streak()} day streak</h2><p class="mu">Consistency beats perfection. Any 3 goals keeps the streak alive.</p></div><div class="card"><h2>${S.mins} focus min</h2><p class="mu">${S.quiz!=null?"Quiz score "+S.quiz+"/5":"Quiz not taken yet"}</p></div></div>
<div class="card"><h2>60-second reset</h2><div id="breath" aria-hidden="true"></div><p id="rt" class="mu" style="text-align:center">Breathe in as it grows, out as it shrinks.</p><button onclick="reset()">Start 60 seconds</button><p class="mu">Then try: roll your shoulders 10 times · name 3 things you can see · tell yourself “I can handle this one step at a time.”</p></div>
<div class="card"><h2>This week</h2><div class="cols">${S.week.map(v=>`<div style="height:${v/5*100}%" title="${v}"></div>`).join("")}</div><div class="mu" style="display:flex;justify-content:space-around">${DAYS.map(d=>`<span>${d}</span>`).join("")}</div><p class="mu">${tot} goals completed this week.</p></div>`},
companion:()=>`<h1>Wellness Companion</h1>${sim("Rule-based demo replies. No AI model is connected. It can’t diagnose and isn’t counseling.")}<div class="card"><div class="chat" id="chat" aria-live="polite"><p>Hi! Ask about peer pressure, habits, sleep, stress or screen time.</p></div><input id="q" placeholder="Type a question" aria-label="Your message" onkeydown="if(event.key==='Enter')ask()"><button onclick="ask()">Send</button></div>`,
assess:()=>{const Q=[["Sleep","I stay up late on screens even when I want to sleep."],["Screens","I lose track of time online."],["Study","I struggle to keep a study routine."],["Peers","I’ve felt pushed to do things I didn’t want to."],["Mood","I feel stressed or low more days than not."],["Habits","I find it hard to stop a habit I want to change."],["Focus","I reach for my phone when I feel uncomfortable."],["Support","I’ve kept worries to myself because I feared judgment."]];
if(S.asm){const a=S.asm,avg=a.reduce((x,y)=>x+y,0)/a.length,c=v=>v<1?["Healthy habit","ok"]:v<2?["Worth improving","bad"]:["Extra support may help","bad"];return`<h1>Your check-in</h1><div class="card"><h2>${c(avg)[0]}</h2><p>This is a snapshot, not a diagnosis, and it doesn’t label you.</p></div>${Q.map((q,i)=>`<div class="card"><b>${q[0]}</b> <span class="tag ${c(a[i])[1]}">${c(a[i])[0]}</span></div>`).join("")}<a class="btn" href="#habits">Start building habits</a><a class="btn o" href="#help">Explore support</a><button class="o" onclick="S.asm=null;sv();go()">Retake</button>`}
return`<h1>Private self-check</h1><p class="mu">Anonymous. No account. Answers stay on your device.</p>${Q.map((q,i)=>`<div class="card"><label for="a${i}">${q[1]}</label><select id="a${i}"><option value="0">Rarely</option><option value="1">Sometimes</option><option value="2">Often</option><option value="3">Almost always</option></select></div>`).join("")}<button onclick="S.asm=[...Array(8)].map((_,i)=>+$('#a'+i).value);sv();go()">See my feedback</button>`},
quiz:()=>{const Q=[["Addiction can affect school performance.",1,"True: focus, sleep and motivation suffer first."],["Peer pressure is always obvious.",0,"Myth: it is often subtle, like jokes or “everyone does it.”"],["Too much screen time can affect daily life.",1,"True: sleep, mood and attention are commonly affected."],["Asking for help is a sign of weakness.",0,"Myth: asking early is a strength and makes things easier."],["Unhealthy habits can slowly become hard to control.",1,"True: small repeats build habits, so early awareness matters."]];
window.qa=window.qa||0;window.qs=window.qs||0;if(qa>=5){S.quiz=qs;sv();const s=qs;qa=0;qs=0;return`<h1>Done!</h1><div class="card">${ring(s*20,s+"/5")}<p style="text-align:center">You scored ${s}/5. Knowing the facts is the first step.</p></div><button onclick="go()">Play again</button>`}
const q=Q[qa];return`<h1>Myth vs Fact</h1>${bar(qa*20)}<div class="card"><p class="mu">Question ${qa+1} of 5 · Score ${qs}</p><h2>${q[0]}</h2><div id="fb"><button onclick="qz(1)">Fact</button><button onclick="qz(0)">Myth</button></div></div>`},
sim:()=>{const C=[["Friends at a party pass something around and say “don’t be boring.”",[["Say “I’m good, I’ll grab a drink,” and move on.","Great: short, calm and confident. No explanation required.",1],["Laugh it off and take it.","Understandable, but it teaches the group that pressure works. Try a firm ‘no thanks’ next time.",0],["Text a trusted friend to come get you.","Smart: having an exit plan is a strong skill.",1]]],["A popular classmate says “everyone vapes, just try once.”",[["“Not for me.” Then change the topic.","Strong: you don’t owe a debate.",1],["Argue about health facts for ten minutes.","Facts matter, but long arguments feed the pressure. Keep it short.",0],["Suggest another activity.","Nice: offering an alternative redirects the group.",1]]],["An influencer post makes risky habits look cool.",[["Notice the edit and the ad, and unfollow.","Media-savvy! Curate your feed to match your goals.",1],["Copy it to fit in.","Online ‘everyone’ is rarely everyone. Check who benefits.",0],["Ask a friend what they think.","Good: talking it through breaks the spell.",1]]]];
return`<h1>Peer Pressure Simulator</h1><p class="mu">Choose your path. There are no wrong people, only more or less helpful moves.</p>${C.map((c,i)=>`<div class="card"><b>${c[0]}</b>${c[1].map((o,j)=>`<div><button class="o" onclick="pick(${i},${j})">${o[0]}</button></div>`).join("")}<div id="s${i}">${S.sim[i]!=null?`<p class="${C[i][1][S.sim[i]][2]?"ok":"bad"}">${C[i][1][S.sim[i]][1]}</p>`:""}</div></div>`).join("")}<p class="mu">Refusal tips: keep it short · use a calm voice · offer an alternative · leave if needed.</p>`},
habits:()=>{const G=["Screen-free hour","Sleep by 11pm","Study 1 hour","Move 30 minutes","Hobby time"],d=S.week.filter(v=>v>=3).length;return`<h1>Habit Restart Tracker</h1><div class="card"><h2>Today</h2>${G.map((g,i)=>`<label style="display:block;margin:6px 0"><input type="checkbox" ${S.chk.includes(i)?"checked":""} onchange="tg(${i})">${g}</label>`).join("")}<p class="ok">${nb()>=3?"Great day! You kept your streak.":nb()?"Nice start. Every step counts.":"Pick one small goal to begin."}</p></div><div class="card"><h2>7-day LEVORA challenge</h2>${bar(d/7*100)}<p class="mu">${d}/7 days with 3+ goals · ${streak()} day streak</p><div class="cols">${S.week.map(v=>`<div style="height:${v/5*100}%"></div>`).join("")}</div></div><div class="card"><h2>Badges</h2>${[["First step",nb()>0||S.week.some(v=>v)],["3-day streak",streak()>=3],["Week hero",d>=7]].map(b=>`<span class="tag ${b[1]?"ok":"mu"}">${b[1]?"★":"○"} ${b[0]}</span> `).join("")}</div>`},
detox:()=>{const sc=S.scr==null?"–":Math.max(0,Math.min(100,Math.round(100-(S.scr-2)*12+Math.min(S.mins,60)/3)));return`<h1>Digital Detox</h1><div class="grid"><div class="card"><h2>Focus timer</h2><div style="font-size:2.2rem" id="tm">25:00</div><button onclick="focus()">Start 25 min</button><button class="o" onclick="stopF()">Stop</button><p class="mu">Completed: ${S.mins} min</p></div><div class="card"><h2>Balance score</h2>${ring(sc==="–"?0:sc,sc)}<label for="sc">Hours on screens for fun today</label><input id="sc" type="number" min="0" max="24" step=".5" value="${S.scr??""}"><button onclick="const v=parseFloat($('#sc').value);if(isNaN(v)||v<0||v>24)return alert('Enter 0 to 24');S.scr=v;sv();go()">Update</button><p class="mu">Based on your own entries. Not a medical assessment.</p></div></div><div class="card"><h2>Offline ideas & tips</h2><p>Walk without headphones · call a friend · sketch · cook · phone out of the bedroom · mute non-human notifications.</p></div>`},
future:()=>{const G={"Successful professional":["Pick a field to explore this month","Finish assignments before leisure","Find one mentor"],"Complete education":["Keep a steady sleep schedule","Study in 25-minute focus blocks","Ask teachers for help early"],"Learn a skill":["Practise 20 min daily","Replace one scroll session with practice","Share progress with a friend"],"Better relationships":["Be present: phone down during meals","Practise kind, firm ‘no’","Check in with someone weekly"],"Healthy lifestyle":["Move 30 min","Sleep 8 hours","Eat one more real meal"]};
return`<h1>My Future Self</h1><p class="mu">Pick goals. We’ll connect today’s choices to them.</p><div class="card">${Object.keys(G).map(k=>`<label style="display:block"><input type="checkbox" ${S.goals.includes(k)?"checked":""} onchange="gl('${k}')">${k}</label>`).join("")}</div>${S.goals.map(k=>`<div class="card"><h2>${k}</h2><ol>${G[k].map((s,i)=>`<li><b>${["Today","This week","This month"][i]}:</b> ${s}</li>`).join("")}</ol></div>`).join("")}`},
help:()=>`<h1>Help & Support</h1><div class="card"><h2>Talk to a person</h2><p><b>Tele-MANAS (India, 24/7):</b> <a href="tel:14416" style="color:var(--ac)">14416</a><br><b>Childline (India):</b> <a href="tel:1098" style="color:var(--ac)">1098</a><br><b>iCall:</b> <a href="tel:9152987821" style="color:var(--ac)">9152987821</a></p><p class="mu">Outside India? Search your country’s youth helpline. Numbers change, so please verify before relying on them. Also try your school or college counselor, or a trusted adult.</p></div><div class="card"><h2>Confidentiality</h2><p>Counselors keep things private, but may need to involve others if you or someone else is at risk. This prototype can’t guarantee anonymity.</p></div><div class="card"><h2>Ask for help</h2>${sim("Nothing is sent. A real deployment needs a secure backend and trained staff.")}<label for="hm">What would you like help with? (don’t include your name)</label><textarea id="hm" rows="3"></textarea><button onclick="const v=$('#hm').value.trim();if(v.length<10)return alert('Please write at least 10 characters.');$('#hr').textContent='Thanks. In a live system this would reach a counselor. For now, please call one of the numbers above or tell a trusted adult.';$('#hm').value=''">Submit</button><p id="hr" class="ok"></p></div>`,
report:()=>`<h1>Report & Track</h1>${sim("Reports are stored only in this browser and are not delivered to anyone.")}<div class="card"><label for="rc">Category</label><select id="rc"><option value="">Choose…</option><option>Substance concern</option><option>Request for help</option><option>Peer pressure</option></select><label for="rd">Description (optional)</label><textarea id="rd" rows="3" maxlength="500"></textarea><label><input type="checkbox" id="ra" checked>Report anonymously</label><button onclick="rp()">Submit report</button><p id="rr" class="ok"></p></div><div class="card"><h2>Track a report</h2><input id="rt2" placeholder="RS-XXXXXX" aria-label="Reference"><button onclick="tr()">Check status</button><p id="rs2"></p></div>`,
admin:()=>{if(!S.adm)return`<h1>Admin</h1><div class="card"><p>Authorized staff only.</p>${sim("Demo access code is “demo”. Real authentication is not implemented.")}<input id="ac" type="password" aria-label="Access code" placeholder="Access code"><button onclick="if($('#ac').value==='demo'){S.adm=1;sv();go()}else alert('Incorrect code')">Sign in</button></div>`;
return`<h1>Admin dashboard</h1>${sim("Sample aggregate data plus counts from this browser. No individual student data is shown.")}<div class="grid">${[["Quiz completions",1284+(S.quiz!=null)],["Challenges done",642+S.week.reduce((a,b)=>a+b,0)],["Support requests",57],["Campaign participants",318]].map(x=>`<div class="card"><h2>${x[1]}</h2><span class="mu">${x[0]}</span></div>`).join("")}</div><div class="card"><h2>Popular topics</h2>${[["Peer pressure",82],["Digital balance",71],["Sleep & study",54],["Asking for help",39]].map(t=>`<div>${t[0]}${bar(t[1])}</div>`).join("")}</div><div class="card"><h2>Reports (this browser)</h2>${S.rep.length?S.rep.map((r,i)=>`<p>${r.id} · ${E(r.c)} · <select aria-label="Status" onchange="S.rep[${i}].s=this.value;sv()" style="width:auto">${["Received","In review","Resolved"].map(s=>`<option ${r.s===s?"selected":""}>${s}</option>`).join("")}</select></p>`).join(""):"<p class='mu'>None yet.</p>"}</div><button class="o" onclick="S.adm=0;sv();go()">Sign out</button>`}};
function go(){const h=(location.hash||"#home").slice(1),k=R[h]?h:"home";$("#nav").innerHTML=P.map(p=>`<a href="#${p[0]}" class="${p[0]===k?"on":""}">${p[1]}</a>`).join("");$("#app").innerHTML=R[k]();window.scrollTo(0,0)}
addEventListener("hashchange",()=>{window.qa=0;window.qs=0;go()});
function tg(i){const j=S.chk.indexOf(i);j<0?S.chk.push(i):S.chk.splice(j,1);S.week[TI]=nb();sv();go()}
function gl(k){const j=S.goals.indexOf(k);j<0?S.goals.push(k):S.goals.splice(j,1);sv();go()}
function qz(v){const Q=[1,0,1,0,1],ex=["Focus, sleep and motivation suffer first.","Pressure is often subtle: jokes, “everyone does it”.","Sleep, mood and attention are commonly affected.","Asking early is a strength and makes things easier.","Small repeats build habits, so early awareness matters."];const ok=v===Q[qa];if(ok)qs++;$("#fb").innerHTML=`<p class="${ok?"ok":"bad"}">${ok?"Correct!":"Not quite."} ${ex[qa]}</p><button onclick="qa++;go()">Next</button>`}
function pick(i,j){S.sim[i]=j;sv();go()}
function ask(){const v=$("#q").value.trim();if(!v)return;const l=v.toLowerCase();let r="Thanks for asking. Small steps and talking to someone you trust both help. What feels hardest right now?";
if(/hurt myself|suicid|kill myself|end my life/.test(l))r="I’m really glad you said that. Please contact someone now: call Tele-MANAS 14416 or your local emergency number, or tell an adult near you.";
else if(/peer|friend|pressure|say no/.test(l))r="Pressure can be subtle. Try a short ‘no thanks’, suggest another plan, or leave with a friend. You don’t owe an explanation.";
else if(/sleep|tired/.test(l))r="Phone out of the bedroom and a steady bedtime help a lot. Try winding down 30 minutes before sleep.";
else if(/screen|phone|scroll/.test(l))r="Try the Digital Detox focus timer and one screen-free hour today. Small and repeatable wins.";
else if(/addict|drug|vape|smok|alcohol/.test(l))r="Habits can slowly get harder to control, which is why early awareness matters. I can’t diagnose, but a counselor or trusted adult can help. See the Help page.";
else if(/stress|sad|anx|low/.test(l))r="That sounds heavy. Try the 60-second reset on your dashboard, and consider sharing this with someone you trust.";
$("#chat").innerHTML+=`<p class="me">${E(v)}</p><p>${r}</p>`;$("#q").value="";$("#chat").scrollTop=1e5}
function reset(){let t=60;const e=$("#rt"),i=setInterval(()=>{e.textContent=--t>0?t+"s · breathe slowly":"Well done. Notice how you feel.";if(t<=0)clearInterval(i)},1000)}
